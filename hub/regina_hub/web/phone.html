<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fbf8ff" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Regina 手机手柄</title>
<style>
  /* Material 3 tonal palette, seeded by the player colour (RS.setPlayer sets --player). */
  :root {
    --player: #5b6cf0;
    --seed: var(--player);
    --bg: color-mix(in oklab, var(--seed) 5%, #111318);
    --s1: color-mix(in oklab, var(--seed) 8%, #1a1c21);
    --s2: color-mix(in oklab, var(--seed) 11%, #212328);
    --s3: color-mix(in oklab, var(--seed) 15%, #2a2c32);
    --on: #e3e2e9;
    --on-var: color-mix(in oklab, var(--seed) 8%, #c4c6d0);
    --outline: color-mix(in oklab, var(--seed) 6%, #44474f);
    --primary: color-mix(in oklab, var(--seed) 62%, white);
    --on-primary: color-mix(in oklab, var(--seed) 40%, #0b0c10);
    --pc: color-mix(in oklab, var(--seed) 58%, #1a1c21);
    --on-pc: color-mix(in oklab, var(--seed) 16%, white);
    --sc: color-mix(in oklab, var(--seed) 22%, #2a2c32);
    --on-sc: color-mix(in oklab, var(--seed) 10%, #e3e2e9);
    --inv: #e3e2e9;
    --on-inv: #2f3036;
    --ok: #7bd88f;
    --warn: #f2c94c;
    --bad: #ffb4ab;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: color-mix(in oklab, var(--seed) 4%, #fbf8ff);
      --s1: color-mix(in oklab, var(--seed) 7%, #f3f1f8);
      --s2: color-mix(in oklab, var(--seed) 10%, #edebf2);
      --s3: color-mix(in oklab, var(--seed) 14%, #e5e3ea);
      --on: #1a1b20;
      --on-var: color-mix(in oklab, var(--seed) 10%, #45464f);
      --outline: color-mix(in oklab, var(--seed) 8%, #c6c6d0);
      --primary: color-mix(in oklab, var(--seed) 82%, black);
      --on-primary: #ffffff;
      --pc: color-mix(in oklab, var(--seed) 26%, white);
      --on-pc: color-mix(in oklab, var(--seed) 55%, black);
      --sc: color-mix(in oklab, var(--seed) 14%, #f0eef6);
      --on-sc: color-mix(in oklab, var(--seed) 30%, #1a1b20);
      --inv: #2f3036;
      --on-inv: #f1f0f7;
      --ok: #1b7a33;
      --warn: #8a6100;
      --bad: #ba1a1a;
      color-scheme: light;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; }
  body {
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: var(--bg); color: var(--on);
    font-family: Roboto, "Google Sans", "Noto Sans SC", "PingFang SC", system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    -webkit-user-select: none; user-select: none;
    transition: background-color .35s;
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ripple + state layer */
  .rp { position: relative; overflow: hidden; isolation: isolate; }
  .rp::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity .15s; z-index: -1; }
  .rp.down::before { opacity: .12; }
  .wave { position: absolute; border-radius: 50%; background: currentColor; opacity: .16; transform: scale(0); pointer-events: none; z-index: -1;
          animation: wave .45s cubic-bezier(.2, 0, 0, 1) forwards; }
  .wave.out { animation: wave .45s cubic-bezier(.2, 0, 0, 1) forwards, fade .3s .1s forwards; }
  @keyframes wave { to { transform: scale(1); } }
  @keyframes fade { to { opacity: 0; } }

  /* ---------------------------------------------------------------- app bar ---- */
  .bar { display: flex; align-items: center; gap: 14px; padding: 10px 8px 6px 16px; min-height: 64px; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none;
            background: var(--primary); color: var(--on-primary); font-weight: 700; font-size: 16px; letter-spacing: .02em; transition: background-color .35s; }
  .who { flex: 1; min-width: 0; }
  .who .t { font-size: 20px; font-weight: 500; line-height: 26px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .s { font-size: 13px; color: var(--on-var); display: flex; align-items: center; gap: 6px; line-height: 18px; }
  .led { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); flex: none; }
  .led.connected { background: var(--ok); }
  .led.connecting { background: var(--warn); }
  .icon-btn { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: var(--on-var); }

  /* ------------------------------------------------------------- game card ---- */
  .left { display: flex; flex-direction: column; }
  .card { position: relative; margin: 4px 16px 0; padding: 18px 22px 20px; border-radius: 28px; background: var(--s2); overflow: hidden; transition: background-color .35s; }
  .ui-title { font-size: 12px; font-weight: 500; letter-spacing: .12em; color: var(--on-var); min-height: 16px; }
  .ui-main { font-size: clamp(40px, 13vw, 57px); line-height: 1.1; font-weight: 400; letter-spacing: -.01em; margin-top: 4px; min-height: 1.1em;
             font-variant-numeric: tabular-nums; color: var(--on); }
  .ui-main.pop { animation: pop .35s cubic-bezier(.2, 0, 0, 1); }
  @keyframes pop { from { transform: translateY(6px); opacity: .3; } to { transform: none; opacity: 1; } }
  .ui-sub { font-size: 16px; line-height: 24px; color: var(--on-var); min-height: 24px; }
  .ui-bar { margin-top: 12px; }
  .ui-bar[hidden] { display: none; }
  .ui-bar-track { height: 4px; border-radius: 2px; background: var(--s3); overflow: hidden; }
  .ui-bar-fill { height: 100%; width: 0; border-radius: 2px; background: var(--primary); transition: width .1s linear; }
  .ui-bar-label { font-size: 12px; color: var(--on-var); margin-top: 6px; letter-spacing: .04em; }
  .ui-toast { position: absolute; left: 50%; bottom: 14px; transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
              padding: 10px 20px; border-radius: 999px; background: var(--primary); color: var(--on-primary);
              font-size: 18px; font-weight: 600; white-space: nowrap; transition: transform .25s cubic-bezier(.2, 0, 0, 1), opacity .2s; }
  .ui-toast.show { transform: translate(-50%, 0); opacity: 1; }

  /* ---------------------------------------------------------------- buttons ---- */
  .pad { flex: 1; min-height: 0; display: grid; gap: 12px; padding: 16px 16px 16px;
         grid-template-columns: 1fr 1fr; grid-template-rows: 76px 1fr 64px; }
  .key { display: flex; align-items: center; justify-content: center; gap: 12px; border-radius: 999px; touch-action: none;
         transition: transform .12s cubic-bezier(.2, 0, 0, 1), background-color .2s, color .2s; }
  .key .k { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 17px; flex: none;
            background: color-mix(in oklab, currentColor 14%, transparent); }
  .key .legend { font-size: 15px; font-weight: 500; letter-spacing: .06em; }
  .key.idle .legend { opacity: .55; font-weight: 400; }
  .key.down { transform: scale(.97); }
  #btnA { grid-column: 1 / -1; background: var(--sc); color: var(--on-sc); }
  #btnA.down { background: var(--primary); color: var(--on-primary); }
  #btnB { grid-column: 1 / -1; border-radius: 40px; flex-direction: column; gap: 4px;
          background: var(--pc); color: var(--on-pc); box-shadow: 0 1px 3px rgba(0,0,0,.18), 0 4px 10px rgba(0,0,0,.12); }
  #btnB .k { width: auto; height: auto; background: none; font-size: clamp(64px, 22vw, 96px); font-weight: 300; line-height: 1; }
  #btnB .legend { font-size: 16px; }
  #btnB.down { background: var(--primary); color: var(--on-primary); box-shadow: none; }
  #btnC, #btnD { background: var(--s2); color: var(--on); }
  #btnC.down, #btnD.down { background: var(--sc); color: var(--on-sc); }

  @media (orientation: landscape) {
    body { flex-direction: row; flex-wrap: wrap; align-content: flex-start; }
    .bar { width: 100%; min-height: 56px; padding-top: 6px; }
    .left { width: 42%; }
    .pad { width: 58%; height: calc(100% - 64px); grid-template-columns: 1fr 1fr 1.4fr; grid-template-rows: 1fr 1fr; padding-top: 4px; }
    #btnA { grid-column: 1 / 3; grid-row: 1; }
    #btnB { grid-column: 3; grid-row: 1 / 3; }
    #btnC { grid-column: 1; grid-row: 2; }
    #btnD { grid-column: 2; grid-row: 2; }
  }

  /* --------------------------------------------------------------- snackbar ---- */
  .snack { position: fixed; left: 16px; right: 16px; top: calc(76px + env(safe-area-inset-top)); z-index: 30; margin: 0 auto; max-width: 480px;
           padding: 14px 16px; border-radius: 4px; background: var(--inv); color: var(--on-inv); font-size: 14px; line-height: 20px;
           box-shadow: 0 3px 8px rgba(0,0,0,.25); opacity: 0; transform: translateY(-8px); pointer-events: none;
           transition: opacity .2s, transform .25s cubic-bezier(.2, 0, 0, 1); }
  .snack.show { opacity: 1; transform: none; }

  /* ---------------------------------------------------------- bottom sheet ---- */
  .scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.32); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 640px; margin: 0 auto;
           padding: 0 0 calc(16px + env(safe-area-inset-bottom)); background: var(--s1); border-radius: 28px 28px 0 0;
           transform: translateY(105%); transition: transform .35s cubic-bezier(.2, 0, 0, 1); touch-action: auto; max-height: 88%; overflow-y: auto; }
  .sheet.open { transform: none; }
  .handle { width: 32px; height: 4px; border-radius: 2px; background: var(--on-var); opacity: .4; margin: 16px auto 8px; }
  .sheet h3 { margin: 8px 24px 8px; font-size: 22px; font-weight: 400; }
  .item { display: flex; align-items: center; gap: 16px; min-height: 72px; padding: 8px 24px; width: 100%; text-align: left; }
  .item > svg { color: var(--on-var); }
  .item .tx { flex: 1; min-width: 0; }
  .item .tx b { display: block; font-size: 16px; font-weight: 400; line-height: 24px; }
  .item .tx span { display: block; font-size: 14px; line-height: 20px; color: var(--on-var); }
  .seg { display: flex; border-radius: 999px; overflow: hidden; border: 1px solid var(--s3); flex: none; }
  .seg button { height: 36px; min-width: 40px; padding: 0 8px; font-size: 14px; color: var(--on-var); }
  .seg button + button { border-left: 1px solid var(--s3); }
  .seg button.on { background: var(--pc); color: var(--on-pc); font-weight: 600; }
  input[type=range] { width: 100%; accent-color: var(--primary); height: 28px; margin: 4px 0 0; }
  .meta { padding: 8px 24px 0; font-size: 12px; color: var(--on-var); line-height: 18px; }

  /* ------------------------------------------------------------- full pages ---- */
  .page { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 16px; padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom)); text-align: center;
          background: var(--bg); touch-action: auto; overflow-y: auto; }
  .page[hidden] { display: none; }
  .page h1 { margin: 0; font-size: 32px; font-weight: 400; line-height: 40px; }
  .page h2 { margin: 0; font-size: 24px; font-weight: 400; line-height: 32px; }
  .page p { margin: 0; font-size: 14px; line-height: 20px; color: var(--on-var); max-width: 340px; }
  .hero { width: 100%; max-width: 360px; padding: 20px; border-radius: 28px; background: var(--s2); }
  .hero svg { width: 100%; height: auto; display: block; }
  .steps { width: 100%; max-width: 360px; text-align: left; border-radius: 16px; overflow: hidden; }
  .step { display: flex; gap: 16px; align-items: center; padding: 12px 16px; background: var(--s1); margin-bottom: 2px; font-size: 14px; line-height: 20px; }
  .step i { font-style: normal; width: 28px; height: 28px; flex: none; border-radius: 50%; display: grid; place-items: center;
            background: var(--pc); color: var(--on-pc); font-weight: 600; font-size: 13px; }
  .filled { height: 56px; padding: 0 32px; border-radius: 999px; background: var(--primary); color: var(--on-primary);
            font-size: 16px; font-weight: 500; letter-spacing: .02em; min-width: 200px; }
  .text-btn { height: 40px; padding: 0 16px; border-radius: 999px; color: var(--primary); font-size: 14px; font-weight: 500; }
  .err { color: var(--bad); font-size: 14px; min-height: 20px; max-width: 340px; }
  .ring { width: 160px; height: 160px; position: relative; display: grid; place-items: center; }
  .ring svg.c { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring .phone { width: 46px; height: 82px; border-radius: 10px; border: 3px solid var(--on-var); animation: wobble 2.2s cubic-bezier(.45, 0, .55, 1) infinite; }
  @keyframes wobble { 0%, 100% { transform: rotate(-28deg); } 50% { transform: rotate(28deg); } }
</style>
</head>
<body>
  <header class="bar">
    <div class="avatar" id="badge">--</div>
    <div class="who">
      <div class="t" id="name">手机手柄</div>
      <div class="s"><span class="led" id="dot"></span><span id="connText">连接中…</span></div>
    </div>
    <button class="icon-btn rp" id="menuBtn" aria-label="设置">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>

  <div class="left">
    <section class="card" id="screen">
      <div class="ui-title"></div>
      <div class="ui-main"></div>
      <div class="ui-sub"></div>
      <div class="ui-bar" hidden><div class="ui-bar-track"><div class="ui-bar-fill"></div></div><div class="ui-bar-label"></div></div>
      <div class="ui-toast"></div>
    </section>
  </div>

  <main class="pad">
    <button class="key rp" id="btnA" data-bit="1"><span class="k">A</span><span class="legend" data-legend="0"></span></button>
    <button class="key rp" id="btnB" data-bit="2"><span class="k">B</span><span class="legend" data-legend="1"></span></button>
    <button class="key rp" id="btnC" data-bit="4"><span class="k">C</span><span class="legend" data-legend="2"></span></button>
    <button class="key rp" id="btnD" data-bit="8"><span class="k">D</span><span class="legend" data-legend="3" data-default="长按归零"></span></button>
  </main>

  <div class="snack" id="warn"></div>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet">
    <div class="handle"></div>
    <h3>设置</h3>
    <div class="item">
      <label class="tx" for="profileName"><b>玩家名字</b><span>同步到游戏中的玩家档案</span></label>
      <input id="profileName" maxlength="20" autocomplete="nickname" style="width:38%;padding:10px;border:1px solid var(--outline);border-radius:12px;background:var(--s1);color:var(--on);font:inherit;user-select:text;touch-action:manipulation">
      <button class="rp" id="saveProfile" style="padding:10px">保存</button>
    </div>
    <button class="item rp" id="recenter">
      <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      <div class="tx"><b>朝向归零</b><span>手机顶端指向屏幕，点一下（也可以长按 D）</span></div>
    </button>
    <button class="item rp" id="calib">
      <svg class="i" viewBox="0 0 24 24"><rect x="3" y="14" width="18" height="5" rx="1.5"/><path d="M7 10l5-5 5 5M12 5v8"/></svg>
      <div class="tx"><b>零偏校准</b><span>把手机平放在桌上别动，再点</span></div>
    </button>
    <button class="item rp" id="redetect">
      <svg class="i" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="18" rx="2"/><path d="M3 9a9 9 0 0 1 3-5M21 15a9 9 0 0 1-3 5"/></svg>
      <div class="tx"><b>重新识别陀螺仪</b><span>手机转向不对时用，点完随意转动几秒</span></div>
    </button>
    <div class="item">
      <svg class="i" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="18" rx="2"/><path d="M4 8v8M20 8v8"/></svg>
      <div class="tx"><b>震动</b><span id="vibeNote"></span></div>
      <div class="seg" id="vibe"><button class="rp">关</button><button class="rp">弱</button><button class="rp">中</button><button class="rp">强</button></div>
    </div>
    <div class="item">
      <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
      <div class="tx"><b>语言</b><span>Language</span></div>
      <div class="seg" id="lang"><button class="rp" data-lang="zh">中文</button><button class="rp" data-lang="en">English</button></div>
    </div>
    <button class="item rp" id="fullscreen">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
      <div class="tx"><b>全屏</b><span>隐藏地址栏（iPhone：分享 › 添加到主屏幕）</span></div>
    </button>
    <div class="meta" id="stats"></div>
  </div>

  <div class="page" id="start">
    <h1>Regina Sports</h1>
    <p>把手机变成体感手柄</p>
    <div class="hero">
      <svg viewBox="0 0 320 130" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="210" y="14" width="98" height="64" rx="8" stroke="currentColor" stroke-width="3" opacity=".55"/>
        <path d="M244 90h30M259 78v12" stroke="currentColor" stroke-width="3" opacity=".55"/>
        <g transform="rotate(-8 92 92)">
          <rect x="30" y="78" width="132" height="30" rx="12" fill="var(--pc)" stroke="var(--on-pc)" stroke-width="2.5"/>
          <circle cx="150" cy="93" r="3.5" fill="var(--on-pc)"/>
        </g>
        <path d="M176 80 L 200 64" stroke="var(--primary)" stroke-width="4"/>
        <path d="M188 60 L 202 63 L 196 76" stroke="var(--primary)" stroke-width="4"/>
      </svg>
    </div>
    <div class="steps">
      <div class="step"><i>1</i><div>像拿遥控器一样握住手机：屏幕朝上，顶端指向电视</div></div>
      <div class="step"><i>2</i><div>大拇指按中间的 B，A 在上、C / D 在下，看按键上的提示</div></div>
      <div class="step"><i>3</i><div>挥动时握紧手机，最好系上挂绳</div></div>
    </div>
    <button class="filled rp" id="go">开始使用</button>
    <div class="err" id="startMsg"></div>
  </div>

  <div class="page" id="setup" hidden>
    <div class="ring">
      <svg class="c" viewBox="0 0 160 160"><circle cx="80" cy="80" r="72" stroke="var(--s3)" stroke-width="6" fill="none"/>
        <circle id="setupArc" cx="80" cy="80" r="72" stroke="var(--primary)" stroke-width="6" fill="none" stroke-linecap="round"
                stroke-dasharray="452.4" stroke-dashoffset="452.4" style="transition: stroke-dashoffset .2s"/></svg>
      <div class="phone"></div>
    </div>
    <h2>随意转动手机</h2>
    <p>正在识别这台手机的陀螺仪：左右转、前后翻、绕着转都来几下，几秒就好。</p>
    <button class="text-btn rp" id="skipSetup">跳过</button>
  </div>

<script src="/static/common.js"></script>
<script>
"use strict";
RS.translatePage();
const $ = (id) => document.getElementById(id);
const ui = new RS.UiView($("screen"));
let buttons = 0;
let accelSign = 0;            // +1 / -1 once detected from deviceorientation
let upFromOrientation = null; // expected "up" direction in the device frame
let motionCount = 0, rateT0 = performance.now(), rateHz = 0, rtt = 0, connState = "connecting";

const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const deviceName = isIOS ? "iPhone" : (/Android/.test(navigator.userAgent) ? "Android" : "Phone");
let profileName = "";
try { profileName = localStorage.getItem("rs-profile-name") || ""; } catch (_) { /* private mode */ }
let playerNo = 0;

const CONN_TEXT = { connected: RS.t("已连接"), connecting: RS.t("连接中…"), disconnected: RS.t("重连中…"), pair_required: RS.t("请重新扫码连接") };
function statusLine() {
  $("name").textContent = (playerNo ? `P${playerNo} · ` : "") + deviceName;
  let s = CONN_TEXT[connState] || connState;
  if (connState === "connected") {
    if (rtt) s += ` · ${RS.t("延迟")} ${Math.round(rtt / 2)} ms`;
    if (rateHz) s += ` · ${rateHz} Hz`;
  }
  $("connText").textContent = s;
  $("dot").className = "led " + connState;
}
function setPlayer(p) {
  playerNo = p;
  RS.setPlayer($("badge"), p);
  $("badge").style.background = "";
  if (!p) document.documentElement.style.setProperty("--player", "#5b6cf0");
  statusLine();
}

const hub = new RS.HubConnection({
  kind: "phone",
  name: deviceName,
  profileName,
  onWelcome: (m) => { setPlayer(m.player); sendInput(); sendBattery(); },
  onState: (s) => { connState = s; statusLine(); },
  onMessage: (m) => {
    if (m.t === "ui") applyUi(m);
    else if (m.t === "pong") { const d = performance.now() - Number(m.c); if (d >= 0 && d < 5000) rtt = rtt ? rtt * 0.7 + d * 0.3 : d; }
    else if (m.t === "player") setPlayer(m.player);
    else if (m.t === "beep") RS.beep(m.freq, m.ms);
    else if (m.t === "vibrate") RS.vibrate(m.pattern || m.ms);
    else if (m.t === "event" && m.name === "recentered") { RS.vibrate(30); note(RS.t("已归零"), 1200); }
    else if (m.t === "event" && m.name === "calibrated") { RS.vibrate(60); note(RS.t("零偏校准完成"), 2000); }
    else if (m.t === "event" && m.name === "calibrate_failed") { RS.vibrate(300); note(RS.t("校准失败：把手机平放在桌上别动，再点一次校准"), 4000); }
  },
});
setInterval(() => hub.send({ t: "ping", c: performance.now() }), 1000);
statusLine();

let lastMain = "";
function applyUi(m) {
  ui.apply(m);
  const main = document.querySelector(".ui-main");
  if (main.textContent !== lastMain) {
    lastMain = main.textContent;
    main.classList.remove("pop");
    void main.offsetWidth;
    main.classList.add("pop");
  }
  document.querySelectorAll(".key").forEach((el) => {
    const lg = el.querySelector("[data-legend]");
    el.classList.toggle("idle", !ui.state.legends[Number(lg.dataset.legend)]);
  });
}
applyUi({});

let noteTimer = 0;
function note(text, ms) {
  const el = $("warn");
  if (text) el.textContent = text;
  el.classList.toggle("show", !!text);
  clearTimeout(noteTimer);
  if (ms) noteTimer = setTimeout(() => { if (el.textContent === text) el.classList.remove("show"); }, ms);
}

function sendInput() { hub.send({ t: "in", b: buttons, d: [0, 0], an: [0, 0] }); }

// ------------------------------------------------------------- touch feedback ----
function ripple(el, e) {
  const r = el.getBoundingClientRect();
  const size = Math.hypot(r.width, r.height) * 2;
  const w = document.createElement("span");
  w.className = "wave";
  w.style.width = w.style.height = size + "px";
  w.style.left = (e.clientX - r.left - size / 2) + "px";
  w.style.top = (e.clientY - r.top - size / 2) + "px";
  el.appendChild(w);
  return w;
}
function releaseWave(w) {
  w.classList.add("out");
  setTimeout(() => w.remove(), 600);
}
document.querySelectorAll(".rp:not(.key)").forEach((el) => {
  el.addEventListener("pointerdown", (e) => { el.classList.add("down"); el._w = ripple(el, e); });
  const up = () => { el.classList.remove("down"); if (el._w) { releaseWave(el._w); el._w = null; } };
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);
  el.addEventListener("pointerleave", up);
});

// ------------------------------------------------------------------ buttons ----
document.querySelectorAll(".key[data-bit]").forEach((el) => {
  const bit = Number(el.dataset.bit);
  const down = (e) => {
    e.preventDefault();
    el.setPointerCapture?.(e.pointerId);
    if (!(buttons & bit)) {
      buttons |= bit;
      sendInput();
      el.classList.add("down");
      el._w = ripple(el, e);
      RS.tick();
    }
  };
  const up = (e) => {
    e.preventDefault();
    if (buttons & bit) {
      buttons &= ~bit;
      sendInput();
      el.classList.remove("down");
      if (el._w) { releaseWave(el._w); el._w = null; }
    }
  };
  el.addEventListener("pointerdown", down);
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);
  el.addEventListener("contextmenu", (e) => e.preventDefault());
});
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

// --------------------------------------------------------------- settings sheet ----
function sheet(open) {
  $("sheet").classList.toggle("open", open);
  $("scrim").classList.toggle("open", open);
}
$("profileName").value = profileName;
$("saveProfile").addEventListener("click", () => {
  profileName = $("profileName").value.replace(/[\u0000-\u001f\u007f]/g, "").trim().slice(0, 20);
  $("profileName").value = profileName;
  hub.profileName = profileName;
  try { localStorage.setItem("rs-profile-name", profileName); } catch (_) { /* private mode */ }
  hub.send({ t: "profile", name: profileName });
  sheet(false);
});
$("menuBtn").addEventListener("click", () => sheet(true));
$("scrim").addEventListener("click", () => sheet(false));
$("recenter").addEventListener("click", () => { hub.send({ t: "recenter" }); sheet(false); });
$("calib").addEventListener("click", () => { hub.send({ t: "calibrate" }); sheet(false); note(RS.t("校准中：保持手机平放不动…"), 3000); });
$("redetect").addEventListener("click", () => { sheet(false); resetDetect(); showSetup(); });
document.querySelectorAll("#lang button").forEach((b) => {
  b.classList.toggle("on", b.dataset.lang === RS.lang());
  b.addEventListener("click", () => { if (b.dataset.lang !== RS.lang()) RS.setLang(b.dataset.lang); });
});

// Vibration strength (kept on this phone). Picking one plays a sample.
function vibeUi() {
  $("vibe").querySelectorAll("button").forEach((b, i) => b.classList.toggle("on", i === RS.vibeLevel()));
  $("vibeNote").textContent = RS.t(RS.canVibrate ? "击中、碰撞时会震"
    : isIOS ? "iPhone 网页只能在按键时轻震（iOS 18 以上），游戏里的震动做不到" : "这个浏览器不支持震动");
}
$("vibe").querySelectorAll("button").forEach((b, i) => b.addEventListener("click", () => {
  RS.setVibeLevel(i);
  if (RS.canVibrate) RS.vibrate([40, 70, 40]);
  else RS.tick();
  vibeUi();
}));
vibeUi();
$("fullscreen").addEventListener("click", async () => { try { await document.documentElement.requestFullscreen?.(); } catch (_) { /* optional */ } sheet(false); });

// ------------------------------------------------------------------ sensors ----
const D2R = Math.PI / 180;

function onOrientation(e) {
  if (e.beta === null || e.gamma === null) return;
  const b = e.beta * D2R, g = e.gamma * D2R;
  // Specific-force ("up") direction in the device frame for W3C Z-X'-Y'' angles.
  upFromOrientation = [-Math.sin(g) * Math.cos(b), Math.sin(b), Math.cos(g) * Math.cos(b)];
  if (e.alpha !== null && !gyroLocked) feedOrientDetect(e.timeStamp, qEuler(e.alpha * D2R, b, g));
}

let signVotes = 0;
function detectSign(ax, ay, az) {
  if (accelSign !== 0 || !upFromOrientation) return;
  const n = Math.hypot(ax, ay, az);
  if (n < 7 || n > 12.5) return;
  const d = (ax * upFromOrientation[0] + ay * upFromOrientation[1] + az * upFromOrientation[2]) / n;
  if (Math.abs(d) < 0.8) return;
  signVotes += d > 0 ? 1 : -1;
  if (Math.abs(signVotes) >= 8) accelSign = signVotes > 0 ? 1 : -1;
}

// ------------------------------------------------------- gyro axis detection ----
// Browsers disagree on rotationRate: the spec has alpha = Z, beta = X, gamma = Y, but Safari on
// iOS and older Chrome fill alpha/beta/gamma from the sensor's x/y/z. Rather than trust either,
// every axis assignment is checked against the browser's own attitude (deviceorientation): its
// turn between two events is the body-frame turn rate in all three axes. Without
// deviceorientation, against how the gravity direction moves (blind to turns about the vertical).
const GYRO_KEY = "rs.gyroMap2";
const CANDIDATES = [];
for (const p of [[0, 1, 2], [0, 2, 1], [1, 0, 2], [1, 2, 0], [2, 0, 1], [2, 1, 0]])
  for (let k = 0; k < 8; k++) CANDIDATES.push({ p, s: [k & 1 ? -1 : 1, k & 2 ? -1 : 1, k & 4 ? -1 : 1], err: 0 });
const ORIENT_NEED = 40;
const GRAV_NEED = 15;

function loadGyroMap() {
  try { const m = JSON.parse(localStorage.getItem(GYRO_KEY)); if (m && m.p && m.s) return m; } catch (_) { /* none */ }
  return { p: [0, 1, 2], s: [1, 1, 1] };
}
let gyroMap = loadGyroMap();
let gyroLocked = false, detectWindows = 0, win = null, lp = null, lastMotionT = null;
let orientSeen = false, prevQ = null, prevQT = 0, rawSum = [0, 0, 0], rawN = 0;

const norm3 = (v) => { const n = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / n, v[1] / n, v[2] / n]; };
const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const mapGyro = (m, r) => [m.s[0] * r[m.p[0]], m.s[1] * r[m.p[1]], m.s[2] * r[m.p[2]]];
const qMul = (p, q) => [p[0] * q[0] - p[1] * q[1] - p[2] * q[2] - p[3] * q[3], p[0] * q[1] + p[1] * q[0] + p[2] * q[3] - p[3] * q[2],
  p[0] * q[2] - p[1] * q[3] + p[2] * q[0] + p[3] * q[1], p[0] * q[3] + p[1] * q[2] - p[2] * q[1] + p[3] * q[0]];

function qEuler(a, b, g) {
  // W3C device orientation: R = Rz(alpha) Rx(beta) Ry(gamma), device -> earth.
  return qMul(qMul([Math.cos(a / 2), 0, 0, Math.sin(a / 2)], [Math.cos(b / 2), Math.sin(b / 2), 0, 0]), [Math.cos(g / 2), 0, Math.sin(g / 2), 0]);
}

function resetDetect() {
  for (const c of CANDIDATES) c.err = 0;
  gyroLocked = false;
  detectWindows = 0;
  win = null;
  prevQ = null;
  rawSum = [0, 0, 0];
  rawN = 0;
  gyroStatus();
}

function feedOrientDetect(t, q) {
  orientSeen = true;
  const dt = (t - prevQT) / 1000;
  if (prevQ && rawN > 0 && dt > 0.005 && dt < 0.12) {
    let d = qMul([prevQ[0], -prevQ[1], -prevQ[2], -prevQ[3]], q);   // body-frame turn since the last event
    if (d[0] < 0) d = d.map((v) => -v);
    const s = Math.hypot(d[1], d[2], d[3]);
    const ang = 2 * Math.atan2(s, d[0]);
    const w = s > 1e-9 ? [d[1] / s * ang / dt, d[2] / s * ang / dt, d[3] / s * ang / dt] : [0, 0, 0];
    const wn = Math.hypot(w[0], w[1], w[2]);
    if (wn > 0.6 && wn < 15) {
      const raw = rawSum.map((v) => v / rawN);
      for (const c of CANDIDATES) {
        const m = mapGyro(c, raw);
        c.err += Math.min(4, ((m[0] - w[0]) ** 2 + (m[1] - w[1]) ** 2 + (m[2] - w[2]) ** 2) / (wn * wn));
      }
      detectWindows++;
      decideAxes(ORIENT_NEED, 0.8);
    }
  }
  prevQ = q;
  prevQT = t;
  rawSum = [0, 0, 0];
  rawN = 0;
}

function feedAxisDetect(dt, r, a) {
  const n = Math.hypot(a[0], a[1], a[2]);
  lp = lp ? lp.map((v, i) => v + 0.35 * (a[i] - v)) : a.slice();
  const ok = n > 7 && n < 12.5;
  if (!win) { if (ok) win = { u0: norm3(lp), s: [], T: 0, bad: false }; return; }
  win.s.push([dt, r]);
  win.T += dt;
  win.bad = win.bad || !ok;
  if (win.T < 0.3) return;
  const u1 = norm3(lp);
  const ang = Math.acos(Math.max(-1, Math.min(1, dot3(win.u0, u1))));
  if (!win.bad && ang > 0.15 && ang < 1.2) {
    for (const c of CANDIDATES) {
      let v = win.u0;
      for (const [sdt, sr] of win.s) {
        const w = mapGyro(c, sr);   // a world-fixed vector seen from the body: dv/dt = -w x v
        const cx = w[1] * v[2] - w[2] * v[1], cy = w[2] * v[0] - w[0] * v[2], cz = w[0] * v[1] - w[1] * v[0];
        v = norm3([v[0] - cx * sdt, v[1] - cy * sdt, v[2] - cz * sdt]);
      }
      c.err += (1 - dot3(v, u1)) / (1 - Math.cos(ang));
    }
    detectWindows++;
    decideAxes(GRAV_NEED, 0.2);
  }
  win = ok ? { u0: u1, s: [], T: 0, bad: false } : null;
}

function decideAxes(need, maxErr) {
  const ranked = CANDIDATES.slice().sort((x, y) => x.err - y.err);
  const best = ranked[0], second = ranked[1];
  // Plenty of evidence and still not 3:1? Settle for a clear 2:1 rather than never deciding.
  const ratio = detectWindows > need * 3 ? 2 : 3;
  if (detectWindows < need || best.err / detectWindows > maxErr || second.err < ratio * best.err) {
    gyroStatus();
    return;
  }
  gyroLocked = true;
  const changed = best.p.join() !== gyroMap.p.join() || best.s.join() !== gyroMap.s.join();
  gyroMap = { p: best.p, s: best.s };
  try { localStorage.setItem(GYRO_KEY, JSON.stringify(gyroMap)); } catch (_) { /* private mode */ }
  RS.vibrate(40);
  gyroStatus();
  note(RS.t(changed ? "陀螺仪轴向已自动修正 ✓" : "陀螺仪正常 ✓"), 2000);
  if (changed) setTimeout(() => hub.send({ t: "recenter" }), 800);
  if (!$("setup").hidden) setTimeout(() => { $("setup").hidden = true; }, 500);
}

function gyroStatus() {
  const need = orientSeen ? ORIENT_NEED : GRAV_NEED;
  const pct = gyroLocked ? 100 : Math.min(97, Math.round(detectWindows / need * 100));
  $("setupArc").setAttribute("stroke-dashoffset", String(452.4 * (1 - pct / 100)));
}

function showSetup() {
  $("setup").hidden = false;
  gyroStatus();
}
$("skipSetup").addEventListener("click", () => { $("setup").hidden = true; });

function onMotion(e) {
  const r = e.rotationRate, a = e.accelerationIncludingGravity;
  if (!r || !a || r.alpha === null || a.x === null) return;
  detectSign(a.x, a.y, a.z);
  const s = accelSign || 1;
  const rr = [(r.alpha || 0) * D2R, (r.beta || 0) * D2R, (r.gamma || 0) * D2R];
  const acc = [s * a.x, s * a.y, s * a.z];
  const dt = lastMotionT === null ? 0 : Math.min(0.1, Math.max(0, (e.timeStamp - lastMotionT) / 1000));
  lastMotionT = e.timeStamp;
  if (!gyroLocked) {
    rawSum = rawSum.map((v, i) => v + rr[i]);
    rawN++;
    if (!orientSeen && dt > 0) feedAxisDetect(dt, rr, acc);
  }
  const w = mapGyro(gyroMap, rr);
  // Every sample goes out at once: batching even three of them costs 50 ms at 60 Hz.
  hub.send({ t: "m", frame: "device", s: [[e.timeStamp, w[0], w[1], w[2], acc[0], acc[1], acc[2]]] });
  motionCount++;
  const now = performance.now();
  if (now - rateT0 > 1000) {
    rateHz = Math.round(motionCount * 1000 / (now - rateT0));
    motionCount = 0; rateT0 = now;
    statusLine();
    $("stats").textContent = `${RS.t("传感器")} ${rateHz} Hz · ${RS.t("往返")} ${Math.round(rtt)} ms · ${RS.t("陀螺仪映射")} ` +
      gyroMap.p.map((v, i) => (gyroMap.s[i] < 0 ? "−" : "") + "αβγ"[v]).join(" ") + RS.t(orientSeen ? "（姿态对照）" : "（重力对照）");
  }
}

async function sendBattery() {
  if (!navigator.getBattery) return;
  try {
    const b = await navigator.getBattery();
    const push = () => hub.send({ t: "st", battery: Math.round(b.level * 100), charging: b.charging });
    push();
    b.addEventListener("levelchange", push);
    b.addEventListener("chargingchange", push);
  } catch (_) { /* unsupported */ }
}

let wakeLock = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (_) { /* denied */ }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && wakeLock) keepAwake(); });

$("go").addEventListener("click", async () => {
  RS.unlockAudio();
  if (!window.isSecureContext) {
    $("startMsg").textContent = RS.t("需要通过 https:// 打开本页才能读取陀螺仪。");
    return;
  }
  try {
    if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
      const p = await DeviceMotionEvent.requestPermission();
      if (p !== "granted") { $("startMsg").textContent = RS.t("没有获得运动传感器权限：请在 设置 › Safari › 高级 › 网站数据 里清除本站后重试，并允许“动作与方向”。"); return; }
      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
        await DeviceOrientationEvent.requestPermission().catch(() => {});
      }
    }
  } catch (err) {
    $("startMsg").textContent = RS.t("请求权限失败：") + err;
    return;
  }
  window.addEventListener("deviceorientation", onOrientation);
  window.addEventListener("devicemotion", onMotion);
  keepAwake();
  try { await document.documentElement.requestFullscreen?.(); } catch (_) { /* optional */ }
  $("start").hidden = true;
  resetDetect();
  showSetup();
  setTimeout(() => {
    if (motionCount === 0 && rateHz === 0) {
      $("setup").hidden = true;
      note(RS.t("没有收到陀螺仪数据：这台设备可能没有陀螺仪，或者浏览器不支持。"));
    }
  }, 2500);
});
</script>
