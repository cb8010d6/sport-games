[project]
name = "regina-hub"
version = "0.1.0"
description = "Regina Sports controller hub: Regina BLE / phone / simulator -> Godot"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "bleak>=0.22",
    "cryptography>=42",
    "qrcode>=7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.17.1"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Preserve the existing hand-wrapped long lines; this change does not run a formatter.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["regina_hub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
