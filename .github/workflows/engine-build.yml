name: Patched Godot engine regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/game/assets/
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build and verify the pinned engine repair
        run: python tools/build_godot.py --jobs 4
      - name: Repeat each concurrent allocation test ten times
        run: python tools/test_engine.py --runs 10 --output audit-output/engine-ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: engine-regression-evidence
          path: |
            audit-output/engine-build-llvm.log
            audit-output/engine-patched/*.json
            audit-output/engine-ci/*.json
            tools/godot/regina-engine.json
