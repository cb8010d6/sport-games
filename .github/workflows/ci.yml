name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
# A new push to a PR or feature branch cancels its stale run; every dev/main push gets its own group and always finishes.
concurrency:
  group: ci-${{ (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  engine-runner:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release tooling tests require the bundled font license notices.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/game/assets/*
            /game/assets/fonts/
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r hub/requirements-dev.txt
      - name: Test process cleanup, native failure, reports and release tooling
        run: python -m pytest -q tools/tests
  hub:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12']
        # The hub ships only on Windows: SIO_UDP_CONNRESET, the Proactor loop and GameLink threads run here.
        include:
          - os: windows-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements-dev.txt
        working-directory: hub
      - run: python -m pytest -q
        working-directory: hub
      - run: python -m ruff check --config hub/pyproject.toml hub tools
      # engine-runner (windows-latest) already runs tools/tests on Windows.
      - if: runner.os != 'Windows'
        run: python -m pytest -q tools/tests
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - run: node --test tools/tests/asset_sync.test.mjs
      # Do not contact upstream asset hosts or download their files on every contribution.
      - run: node tools/publication_audit.mjs --privacy-only
      # docs/CODING_STANDARDS.md rules (standard library only, no setup needed).
      - run: python3 tools/check_conventions.py
      - run: python3 tools/i18n_check.py
  game-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the controller model preloaded by bowling and the bundled UI fonts; omit the large art tree.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/game/assets/*
            /game/assets/models/
            !/game/assets/models/*
            /game/assets/models/regina.glb
            /game/assets/models/regina.glb.import
            /game/assets/fonts/
            /game/assets/music/
            /game/assets/previews/
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Download pinned Godot
        run: |
          mkdir -p tools/godot
          cd tools/godot
          curl --fail --location --retry 3 -O https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl --fail --location --retry 3 -O https://github.com/godotengine/godot/releases/download/4.7.2-stable/SHA512-SUMS.txt
          sha512sum --ignore-missing -c SHA512-SUMS.txt
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Register script classes
        run: python tools/import_game.py --godot tools/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Test saves and complete party flow
        run: python tools/test_game.py --godot tools/godot/Godot_v4.7.2-stable_linux.x86_64 --party
      # The other sports need the complete art tree; the package job covers them.
      - name: Test UDP controls, pause, restart and reconnect
        run: python tools/test_lifecycle.py --godot tools/godot/Godot_v4.7.2-stable_linux.x86_64 --games plane archery bowling
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lifecycle-source
          path: audit-output/lifecycle/
          if-no-files-found: warn
      - name: Test formal solo opponents at all difficulty levels
        run: python tools/test_solo.py --godot tools/godot/Godot_v4.7.2-stable_linux.x86_64 --games plane archery bowling
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: solo-lightweight
          path: audit-output/solo
          if-no-files-found: warn
      - name: Test music buses, fades, pause and scene lifecycle
        run: python tools/test_music.py --godot tools/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Test per-player hand preferences, mirrored motion and tutorials
        run: python tools/test_left_hand.py --godot tools/godot/Godot_v4.7.2-stable_linux.x86_64 --ui-only
      - name: Test parallel instances and ControllerHub ports
        run: python tools/test_hub_port.py --godot tools/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Test bilingual menu previews and input navigation
        run: python tools/test_menu_preview.py --godot tools/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Test camera accessibility settings and reload
        run: python tools/test_camera_comfort.py --godot tools/godot/Godot_v4.7.2-stable_linux.x86_64 --ui-only
      - name: Test shared podium ranks, geometry and results framing
        run: python tools/test_podium.py --godot tools/godot/Godot_v4.7.2-stable_linux.x86_64 --math-only
      - name: Test shared slow-motion timing and recording windows
        run: python tools/test_replay.py --godot tools/godot/Godot_v4.7.2-stable_linux.x86_64 --math-only
      - name: Test shared opening geometry and boundary cases
        run: python tools/test_intro.py --godot tools/godot/Godot_v4.7.2-stable_linux.x86_64 --math-only
      - name: Test bilingual text sizes, live menus and reload
        run: python tools/test_text_size.py --godot tools/godot/Godot_v4.7.2-stable_linux.x86_64 --ui-only
      - name: Test skate/ski sub-step cap, course lookups and split-screen shadow tier
        run: python tools/test_perf.py --godot tools/godot/Godot_v4.7.2-stable_linux.x86_64
