name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  engine-runner:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/game/assets/
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r hub/requirements-dev.txt
      - name: Test process cleanup, native failure, reports and release tooling
        run: python -m pytest -q tools/tests
  hub:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements-dev.txt
        working-directory: hub
      - run: python -m pytest -q
        working-directory: hub
      - run: python -m ruff check --config hub/pyproject.toml hub tools
      - run: python -m pytest -q tools/tests
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - run: node --test tools/tests/asset_sync.test.mjs
      # Do not contact upstream asset hosts or download their files on every contribution.
      - run: node tools/publication_audit.mjs --privacy-only
      # docs/CODING_STANDARDS.md rules (standard library only, no setup needed).
      - run: python3 tools/check_conventions.py
  game-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the controller model preloaded by bowling; omit the large art tree.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/game/assets/*
            /game/assets/models/
            !/game/assets/models/*
            /game/assets/models/regina.glb
            /game/assets/models/regina.glb.import
            /game/assets/music/
            /game/assets/previews/
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Download pinned Godot
        run: |
          mkdir -p tools/godot
          cd tools/godot
          curl --fail --location --retry 3 -O https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl --fail --location --retry 3 -O https://github.com/godotengine/godot/releases/download/4.7.2-stable/SHA512-SUMS.txt
          sha512sum --ignore-missing -c SHA512-SUMS.txt
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Register script classes
        run: python tools/import_game.py --godot tools/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Test saves and complete party flow
        run: python tools/test_game.py --godot tools/godot/Godot_v4.7.2-stable_linux.x86_64 --party
      # The other sports need the complete art tree; the package job covers them.
      - name: Test UDP controls, pause, restart and reconnect
        run: python tools/test_lifecycle.py --godot tools/godot/Godot_v4.7.2-stable_linux.x86_64 --games plane archery bowling
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lifecycle-source
          path: audit-output/lifecycle/
          if-no-files-found: warn
      - name: Test formal solo opponents at all difficulty levels
        run: python tools/test_solo.py --godot tools/godot/Godot_v4.7.2-stable_linux.x86_64 --games plane archery bowling
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: solo-lightweight
          path: audit-output/solo
          if-no-files-found: warn
      - name: Test music buses, fades, pause and scene lifecycle
        run: python tools/test_music.py --godot tools/godot/Godot_v4.7.2-stable_linux.x86_64
      - run: python tools/i18n_check.py
      - name: Test bilingual menu previews and input navigation
        run: python tools/test_menu_preview.py --godot tools/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Test camera accessibility settings and reload
        run: python tools/test_camera_comfort.py --godot tools/godot/Godot_v4.7.2-stable_linux.x86_64 --ui-only
      - name: Test shared slow-motion timing and recording windows
        run: python tools/test_replay.py --godot tools/godot/Godot_v4.7.2-stable_linux.x86_64 --math-only
