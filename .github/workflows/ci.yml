name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  hub:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements-dev.txt
        working-directory: hub
      - run: python -m pytest -q
        working-directory: hub
      - run: python -m ruff check --config hub/pyproject.toml hub tools
      - run: python -m pytest -q tools/tests
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - run: node --test tools/tests/asset_sync.test.mjs
      # Do not contact upstream asset hosts or download their files on every contribution.
      - run: node tools/publication_audit.mjs --privacy-only
      # docs/CODING_STANDARDS.md rules (standard library only, no setup needed).
      - run: python3 tools/check_conventions.py
