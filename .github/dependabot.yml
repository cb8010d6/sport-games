version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /hub
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ['*']
